name: poopoolog

version: 0.1.1+5

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1

  # DB
  drift: ^2.18.0
  sqlite3_flutter_libs: ^0.5.0
  path_provider: ^2.1.3
  path: ^1.9.0

  # 상태 관리
  flutter_riverpod: ^2.5.1

  # 캘린더
  table_calendar: ^3.1.2

  # 차트
  fl_chart: ^0.68.0
  logger: ^2.7.0
  flutter_localizations:
    sdk: flutter

  # 광고
  google_mobile_ads: ^5.1.0

  # 더보기
  url_launcher: ^6.0.0
  in_app_review: ^2.0.0
  package_info_plus: ^8.0.0
  shared_preferences: ^2.3.0
  share_plus: ^10.0.3
  file_picker: ^8.0.0
  in_app_purchase: ^3.2.0

  # Firebase
  firebase_core: ^3.13.1
  firebase_remote_config: ^5.4.4

  # 홈 화면 위젯
  home_widget: ^0.9.1

  # 알림
#  flutter_local_notifications: ^17.2.2
#  timezone: ^0.9.4
#  permission_handler: ^11.3.1


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.11
  drift_dev: ^2.18.0
  flutter_launcher_icons: ^0.14.1
  flutter_native_splash: ^2.4.0
  url_launcher_platform_interface: any

flutter:

  uses-material-design: true

  assets:
    - assets/splash/splash.jpg

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#FAF3E8"
  adaptive_icon_foreground: "assets/icon/app_icon.png"
  web:
    generate: false

flutter_native_splash:
  background_image: "assets/splash/splash.jpg"
  android: true
  ios: true
  android_12:
    background_image: "assets/splash/splash.jpg"
